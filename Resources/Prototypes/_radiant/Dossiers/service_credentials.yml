- type: entity
  parent: BaseItem
  id: BaseRadiantCredentialDvb
  abstract: true
  name: DVB service credential
  description: An official service credential of the Department of Internal Security.
  components:
  - type: Item
    size: Small
  - type: ServiceCredential
    service: Dvb
  - type: Sprite
    sprite: _radiant/Objects/Documents/ServiceCredentials.rsi
    state: dvb_closed
  - type: Icon
    sprite: _radiant/Objects/Documents/ServiceCredentials.rsi
    state: dvb_closed
  - type: UserInterface
    interfaces:
      enum.ServiceCredentialUiKey.Key:
        type: ServiceCredentialBoundUserInterface

- type: entity
  parent: BaseRadiantCredentialDvb
  id: BaseRadiantCredentialFleet
