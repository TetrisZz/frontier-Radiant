# This should be on every other fishing table
- type: entityTable
  id: BasicFishingLootTable
  table: !type:GroupSelector
    children:
    # 75% chance of scrap of some kind
    - !type:GroupSelector
      weight: 75
      children:
      - !type:NestedSelector
        tableId: SalvageScrapLowValue
        weight: 65
      - !type:NestedSelector
        tableId: SalvageScrapHighValue
        weight: 35
    # 15% chance of some trash
    - !type:NestedSelector
      tableId: GenericTrashItems
      weight: 15
    # 10% chance of low-value treasure or maintenance tools
    - !type:GroupSelector
      weight: 10
      children:
      - !type:NestedSelector
        tableId: SalvageTreasureCommon
      - !type:NestedSelector
        tableId: MaintToolsTable

# Rare catches from ordinary waters.
- type: entityTable
  id: WaterRareFishTable
  table: !type:GroupSelector
    children:
    - id: FishBingle
    - id: FishBoyFisher
    - id: FishNukeDisk
    - id: FishIan

# Fish from water
- type: entityTable
  id: WaterFishTable
  table: !type:GroupSelector
    children:
    - id: FishAngler
    - id: FishBass
    - id: FishBlob
    - id: FishBlueFintuna
    - id: FishCat
    - id: FishTropicalClown
    - id: FishPuffer
    - id: FishSilver
    - id: FishTropicalSun
    - id: FishTropical

- type: entityTable
  id: PollutedFishTable
  table: !type:GroupSelector
    children:
    - id: FishBlob
    - id: FishPuffer
    - id: FishGib
    - id: FishNuker

- type: entityTable
  id: PollutedRareFishTable
  table: !type:GroupSelector
    children:
    - id: FishMutant
    - id: FishToxic

- type: entityTable
  id: ExpeditionFishTable
  table: !type:GroupSelector
    children:
    - id: FishAngler
    - id: FishBlueFintuna
    - id: FishTropical
    - id: FishTropicalSun
    - id: FishSilver

- type: entityTable
  id: ExpeditionRareFishTable
  table: !type:GroupSelector
    children:
    - id: FishAlien
    - id: FishBoyFisher
    - id: FishIan

# Bait changes the species only after the main table has rolled a fish.
- type: entityTable
  id: WaterNaturalBaitFishTable
  table: !type:GroupSelector
    children:
    - id: FishCat
    - id: FishBass
    - id: FishAngler
    - id: FishPuffer

- type: entityTable
  id: WaterLuminousBaitFishTable
  table: !type:GroupSelector
    children:
    - id: FishSilver
    - id: FishTropicalSun
    - id: FishTropicalClown
    - id: FishIan

- type: entityTable
  id: PollutedNaturalBaitFishTable
  table: !type:GroupSelector
    children:
    - id: FishBlob
    - id: FishPuffer
    - id: FishToxic

- type: entityTable
  id: PollutedLuminousBaitFishTable
  table: !type:GroupSelector
    children:
    - id: FishMutant
    - id: FishGib
    - id: FishNuker

- type: entityTable
  id: ExpeditionNaturalBaitFishTable
  table: !type:GroupSelector
    children:
    - id: FishAngler
    - id: FishBlueFintuna
    - id: FishTropical
    - id: FishTropicalSun

- type: entityTable
  id: ExpeditionLuminousBaitFishTable
  table: !type:GroupSelector
    children:
    - id: FishAlien
    - id: FishBoyFisher
    - id: FishIan

- type: entityTable
  id: PollutedFishingDebrisTable
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: GenericTrashItems
      weight: 60
    - !type:NestedSelector
      tableId: SalvageScrapHighValue
      weight: 40

- type: entityTable
  id: ExpeditionFishingFindsTable
  table: !type:GroupSelector
    children:
    - !type:NestedSelector
      tableId: SalvageTreasureCommon
      weight: 60
    - !type:NestedSelector
      tableId: SalvageScrapHighValue
      weight: 40

# Items from Water
- type: entityTable
  id: WaterFishingLootTable
  table: !type:GroupSelector
    children:
      - !type:NestedSelector
        tableId: BasicFishingLootTable
        weight: 15
      - !type:NestedSelector
        tableId: WaterFishTable
        weight: 70
      - !type:NestedSelector
        tableId: WaterRareFishTable
        weight: 15

- type: entityTable
  id: PollutedFishingLootTable
  table: !type:GroupSelector
    children:
      - !type:NestedSelector
        tableId: PollutedFishingDebrisTable
        weight: 25
      - !type:NestedSelector
        tableId: PollutedFishTable
        weight: 60
      - !type:NestedSelector
        tableId: PollutedRareFishTable
        weight: 15

- type: entityTable
  id: ExpeditionFishingLootTable
  table: !type:GroupSelector
    children:
      - !type:NestedSelector
        tableId: ExpeditionFishingFindsTable
        weight: 15
      - !type:NestedSelector
        tableId: ExpeditionFishTable
        weight: 65
      - !type:NestedSelector
        tableId: ExpeditionRareFishTable
        weight: 20

# Items from Lava
- type: entityTable
  id: LavaFishingLootTable
  table: !type:GroupSelector
    children:
      # TODO: lava/plasma fish
      - !type:NestedSelector
        tableId: BasicFishingLootTable

# Items from Plasma
- type: entityTable
  id: PlasmaFishingLootTable
  table: !type:GroupSelector
    children:
    # TODO: lava/plasma fish
      - !type:NestedSelector
        tableId: BasicFishingLootTable

# Items from Toilets
- type: entityTable
  id: ToiletFishingLootTable
  table: !type:GroupSelector
    children:
      # like water but no rare fishes
      - !type:NestedSelector
        tableId: BasicFishingLootTable
        weight: 80
      - !type:NestedSelector
        tableId: WaterFishTable
        weight: 20
