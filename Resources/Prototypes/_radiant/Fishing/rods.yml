# Basic rod
- type: entity
  id: FishingRod
  parent: BaseItem
  name: fishing rod
  description: A light rod with a sturdy line and float.
  components:
  - type: GuideHelp
    guides: [RadiantAngling, RadiantMechanics, Medical]
  - type: Sprite
    sprite: _radiant/Objects/Specific/Fishing/rods.rsi
    state: fishing_rod
  - type: Item
    sprite: _radiant/Objects/Specific/Fishing/rod_inhands.rsi
    size: Normal
  - type: UseDelay # Just for visuals and to prevent autoclickers
    delay: 0.08 # 12,5 CPS at max
  - type: MeleeWeapon
    wideAnimationRotation: 45
    attackRate: 1.0
    damage:
      types:
        Blunt: 5
  - type: FishingRod
  - type: ItemSlots
    slots:
      fishing_hook:
        name: fishing-slot-hook
        startingItem: RadiantFishingHook
        insertSound: /Audio/Items/toolbox_insert.ogg
        ejectSound: /Audio/Items/toolbox_remove.ogg
        whitelist:
          components:
          - FishingHook
      fishing_line:
        name: fishing-slot-line
        startingItem: RadiantFishingLine
        insertSound: /Audio/Items/toolbox_insert.ogg
        ejectSound: /Audio/Items/toolbox_remove.ogg
        whitelist:
          components:
          - FishingLine

# Variation of a normal rod
- type: entity
  id: FishingRodClassic
  suffix: classic
  parent: FishingRod
  name: fishing rod
  description: A well-worn rod with a sturdy line.
  components:
  - type: Sprite
    sprite: _radiant/Objects/Specific/Fishing/rods.rsi
    state: fishing_rod_telescopic
  - type: Item
    sprite: _radiant/Objects/Specific/Fishing/rod_inhands.rsi
    size: Normal
  - type: FishingRod
    biteTimeMultiplier: 0.8
    efficiency: 0.9

# Makeshift rod
- type: entity
  id: FishingRodMakeshift
  parent: FishingRod
  name: makeshift fishing rod
  description: A rod assembled from spare materials.
  components:
  - type: Sprite
    sprite: _radiant/Objects/Specific/Fishing/rods.rsi
    state: fishing_rod_bone
  - type: Item
    sprite: _radiant/Objects/Specific/Fishing/rod_inhands.rsi
    size: Normal
  - type: FishingRod
    floatPrototype: FishingLureMakeshift
    efficiency: 0.8
    biteTimeMultiplier: 1.25

# Golden rod
- type: entity
  id: FishingRodGolden
  parent: FishingRod
  name: golden fishing rod
  description: A polished rod with an unusually smooth reel.
  components:
  - type: Sprite
    sprite: _radiant/Objects/Specific/Fishing/rods.rsi
    state: fishing_rod_master
  - type: Item
    sprite: _radiant/Objects/Specific/Fishing/rod_inhands.rsi
    size: Normal
  - type: FishingRod
    efficiency: 1.3
  - type: MeleeWeapon
    wideAnimationRotation: 45
    attackRate: 1.0
    damage:
      types:
        Blunt: 5

# Normal fishing lure
- type: entity
  id: FishingLure
  parent: BaseItem
  name: fishing lure
  description: A light float attached to a fishing line.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    sprite: _radiant/Objects/Specific/Fishing/fishing_lure.rsi
    state: icon
  - type: Item
    sprite: _radiant/Objects/Specific/Fishing/fishing_lure.rsi
    size: Normal
  - type: FishingLure

- type: entity
  id: FishingLureMakeshift
  parent: FishingLure
  name: fishing lure
  description: A light float attached to a fishing line.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    noRot: true
    sprite: _radiant/Objects/Specific/Fishing/makeshift_lure.rsi
    state: icon
  - type: Item
    sprite: _radiant/Objects/Specific/Fishing/makeshift_lure.rsi
    size: Normal
