- type: "entity"
  id: "RadiantArtisanStationBase"
  parent: "BaseStructure"
  name: "artisan station"
  components:
    - type: "Sprite"
      sprite: "_radiant/Structures/Artisan/workstations.rsi"
      layers:
        - state: "crafting_bench_empty"
          map:
            - "enum.ArtisanVisuals.Layer"
    - type: "Transform"
      anchored: true
    - type: "InteractionOutline"
    - type: "Anchorable"
    - type: "Physics"
      bodyType: "Static"
    - type: "Fixtures"
      fixtures:
        fix1:
          shape: !type:PhysShapeAabb {bounds: "-0.35,-0.35,0.35,0.35"}
          density: 100
          mask:
            - "MachineMask"
          layer:
            - "MachineLayer"
    - type: "ContainerContainer"
      containers:
        artisan_inputs: !type:Container {}
    - type: "ActivatableUI"
      key: "enum.ArtisanUiKey.Key"
    - type: "UserInterface"
      interfaces:
        enum.ArtisanUiKey.Key:
          type: "ArtisanBoundUserInterface"
    - type: "Appearance"
    - type: GuideHelp
      guides: [RadiantArtisanWorkshop, RadiantMechanics, Medical]
  abstract: true
- type: "entity"
  id: "RadiantPotteryWheel"
  parent: "RadiantArtisanStationBase"
  name: "pottery workshop"
  components:
    - type: GuideHelp
      guides: [RadiantPottery, RadiantMechanics, Medical]
    - type: "Sprite"
      sprite: "_radiant/Structures/Artisan/workstations.rsi"
      layers:
        - state: "throw_wheel_empty"
          map:
            - "enum.ArtisanVisuals.Layer"
    - type: "ArtisanStation"
      kind: "Pottery"
      needsPower: false
      maximumTemperature: 1100
    - type: "Construction"
      graph: "RadiantPotteryWheel"
      node: "finished"
    - type: "GenericVisualizer"
      visuals:
        enum.ArtisanVisuals.Active:
          enum.ArtisanVisuals.Layer:
            True:
              state: "throw_wheel_full"
            False:
              state: "throw_wheel_empty"
    - type: "SolutionContainerManager"
      solutions:
        artisan_tank:
          maxVol: 500
          canReact: false
    - type: "RefillableSolution"
      solution: "artisan_tank"
    - type: "DrainableSolution"
      solution: "artisan_tank"
    - type: "DumpableSolution"
      solution: "artisan_tank"
- type: "entity"
  id: "RadiantArtisanKiln"
  parent: [RadiantArtisanStationBase, SmallConstructibleMachine]
  name: "kiln workshop"
  components:
    - type: GuideHelp
      guides: [RadiantPottery, RadiantMechanics, Medical]
    - type: "Sprite"
      sprite: "_radiant/Structures/Artisan/workstations.rsi"
      layers:
        - state: "forge_inactive"
          map:
            - "enum.ArtisanVisuals.Layer"
    - type: "ArtisanStation"
      kind: "Kiln"
      needsPower: true
      maximumTemperature: 900
    - type: "Construction"
      graph: Machine
      node: machine
      containers: [machine_board, machine_parts, artisan_inputs]
    - type: "ExtensionCableReceiver"
    - type: "ApcPowerReceiver"
      powerLoad: 2000
    - type: "GenericVisualizer"
      visuals:
        enum.ArtisanVisuals.Active:
          enum.ArtisanVisuals.Layer:
            True:
              state: "forge_active"
            False:
              state: "forge_inactive"
    - type: Machine
      board: RadiantArtisanKilnMachineCircuitboard
    - type: EmptyOnMachineDeconstruct
      containers: [artisan_inputs]
