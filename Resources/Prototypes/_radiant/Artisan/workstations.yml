- type: "entity"
  id: "RadiantFermentationBarrel"
  parent: "RadiantArtisanStationBase"
  name: "fermenter workshop"
  components:
    - type: GuideHelp
      guides: [RadiantFermentation, RadiantMechanics, Medical]
    - type: "Sprite"
      sprite: "_radiant/Structures/Artisan/brewing.rsi"
      layers:
        - state: "barrel"
          map:
            - "enum.ArtisanVisuals.Layer"
    - type: "ArtisanStation"
      kind: "Fermenter"
      fillModeSound:
        path: /Audio/_radiant/Artisan/barrel_open.ogg
        params:
          volume: -10
      drainModeSound:
        path: /Audio/_radiant/Artisan/barrel_close.ogg
        params:
          volume: -10
      needsPower: false
      maximumTemperature: 1100
    - type: "Construction"
      graph: "RadiantFermentationBarrel"
      node: "finished"
    - type: "SolutionContainerManager"
      solutions:
        artisan_tank:
          maxVol: 500
          canReact: false
    - type: "RefillableSolution"
      solution: "artisan_tank"
    - type: "DrainableSolution"
      solution: "artisan_tank"
    - type: "DumpableSolution"
      solution: "artisan_tank"
    - type: "AmbientSound"
      enabled: false
      range: 4
      volume: -14
      sound:
        path: /Audio/_radiant/Artisan/ferment.ogg
