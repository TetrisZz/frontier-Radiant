- type: entity
  id: HandheldLanguageTranslator
  parent: [BaseItem, PowerCellSlotSmallItem]
  name: портативный переводчик
  description: Карманное устройство для машинного перевода письменных документов.
  components:
  - type: Sprite
    sprite: _radiant/Objects/Devices/language_translator.rsi
    layers:
    - state: icon
    - state: adv-o
      shader: unshaded
      visible: false
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Item
    sprite: _radiant/Objects/Devices/language_translator.rsi
    heldPrefix: inhand
    storedRotation: -90
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.125
    soundDeactivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.125
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.125
  - type: PowerCellDraw
    drawRate: 0
    useRate: 25
  - type: ToggleCellDraw
  - type: LanguageTranslator
    scanDelay: 2
    chargePerScan: 25
  - type: UserInterface
    interfaces:
      enum.LanguageTranslatorUiKey.Key:
        type: LanguageTranslatorBoundUserInterface
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: StaticPrice
    price: 500
