- type: entity
  parent: BaseItem
  id: BaseVibe
  abstract: true
  components:
  - type: PhysicalComposition
    materialComposition:
      Plastic: 75
      Steel: 25
  - type: Vibrator
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
    - Toggle
    - On
    - Off
  - type: StaticPrice 
    price: 100
    vendPrice: 3000 
  - type: ItemToggle
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/_radiant/Lewd/vibrate_loop.ogg
  - type: UseDelay
    delay: 1.0
  - type: Appearance 

- type: entity
  parent: [BaseVibe, ClothingButtPlugBase]
  id: LewdWand
  name: magic wand
  description: A magic wand! This one casts spells of pleasure!
  components:
  - type: Sprite
    sprite: _radiant/Objects/Fun/Erp/Vibes/magic_wand.rsi
    layers:
    - state: magicwand_off
      map: ["enum.ToggleableVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Color:
        enum.ToggleableVisuals.Layer:
          Off: { state: magicwand_off }
          Low: { state: magicwand_low }
          Medium: { state: magicwand_medium }
          Hard: { state: magicwand_hard }

