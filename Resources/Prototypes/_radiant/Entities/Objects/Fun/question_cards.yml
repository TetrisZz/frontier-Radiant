- type: entity
  parent: BaseItem
  id: QuestionDeck
  name: question cards
  description: A deck for getting to know each other. Draw a card to read a question.
  components:
  - type: GuideHelp
    guides: [RadiantLeisure, RadiantMechanics, Medical]
  - type: Sprite
    sprite: _radiant/Objects/Fun/question_cards.rsi
    state: questions
  - type: QuestionDeck
    cards: [question-card-1, question-card-2, question-card-3, question-card-4, question-card-5, question-card-6, question-card-7, question-card-8, question-card-9, question-card-10]
  - type: Item
    size: Small
  - type: StaticPrice
    price: 50
  - type: Tag
    tags: [ConversationDeck]

- type: entity
  parent: QuestionDeck
  id: DareDeck
  name: dare cards
  components:
  - type: Sprite
    state: dares
  - type: QuestionDeck
    cards: [dare-card-1, dare-card-2, dare-card-3, dare-card-4, dare-card-5, dare-card-6, dare-card-7, dare-card-8, dare-card-9, dare-card-10]

- type: entity
  parent: QuestionDeck
  id: AdultQuestionDeck
  name: adults-only question cards
  description: Personal questions for a consenting adult company. Any card can be skipped.
  components:
  - type: Sprite
    state: adult
  - type: QuestionDeck
    cards: [adult-card-1, adult-card-2, adult-card-3, adult-card-4, adult-card-5, adult-card-6, adult-card-7, adult-card-8, adult-card-9, adult-card-10]

- type: entity
  parent: QuestionDeck
  id: BlankCardDeck
  name: blank cards
  components:
  - type: Sprite
    state: blanks
  - type: QuestionDeck
    blank: true

- type: entity
  parent: Paper
  id: QuestionCard
  name: question card
  description: A small card. Blank cards can be written on with a pen.
  components:
  - type: GuideHelp
    guides: [RadiantLeisure, RadiantMechanics, Medical]
  - type: Sprite
    sprite: _radiant/Objects/Fun/question_cards.rsi
    layers:
    - state: card
    - state: card
      visible: false
      map: ["enum.PaperVisualLayers.Writing"]
    - sprite: Objects/Misc/bureaucracy.rsi
      state: paper_stamp-generic
      visible: false
      map: ["enum.PaperVisualLayers.Stamp"]

- type: entity
  parent: BoxCardboard
  id: BoxQuestionDeck
  name: conversation cards gift box
  components:
  - type: Sprite
    layers:
    - state: box_hug
      color: "#A8D5CE"
    - state: heart
      color: "#427D8A"
  - type: Item
    heldPrefix: hug
  - type: Storage
    grid:
    - 0,0,3,1
    whitelist:
      tags: [ConversationDeck]
      components: [Paper]
  - type: StorageFill
    contents:
    - id: QuestionDeck
  - type: StaticPrice
    price: 75

- type: entity
  parent: BoxQuestionDeck
  id: BoxDareDeck
  name: dare cards gift box
  components:
  - type: Sprite
    layers:
    - state: box_hug
      color: "#E8C178"
    - state: heart
      color: "#B36B50"
  - type: StorageFill
    contents:
    - id: DareDeck

- type: entity
  parent: BoxQuestionDeck
  id: BoxAdultQuestionDeck
  name: after midnight cards gift box
  components:
  - type: Sprite
    layers:
    - state: box_hug
      color: "#BD92AE"
    - state: heart
      color: "#762C50"
  - type: StorageFill
    contents:
    - id: AdultQuestionDeck

- type: entity
  parent: BoxQuestionDeck
  id: BoxBlankCardDeck
  name: blank cards gift box
  components:
  - type: Sprite
    layers:
    - state: box_hug
      color: "#D9DDE0"
    - state: heart
      color: "#637184"
  - type: StorageFill
    contents:
    - id: BlankCardDeck

- type: Tag
  id: ConversationDeck
