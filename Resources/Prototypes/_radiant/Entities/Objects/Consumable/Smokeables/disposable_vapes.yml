- type: entity
  abstract: true
  parent: Clothing
  id: DisposableVapeBase
  name: disposable vape
  description: A compact vape with a sealed reservoir of flavored liquid. Its colorful casing bears the flavor label.
  components:
  - type: Sprite
    state: icon
    scale: 0.5, 0.5
  - type: Item
    size: Tiny
  - type: Clothing
    slots: [mask]
  - type: DisposableVape
    puffsRemaining: 30
    puffInterval: 5
    nicotinePerPuff: 0.2
  - type: StaticPrice
    price: 50
    vendPrice: 100
  - type: Tag
    tags: [Cigarette]

- type: entity
  parent: DisposableVapeBase
  id: DisposableVapeBlack
  name: berry disposable vape
  components:
