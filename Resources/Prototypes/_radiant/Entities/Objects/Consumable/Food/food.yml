- type: entity # Radiant
  parent: FoodMealBase
  id: FoodMealBaconEggRS
  name: яичница с беконом
  description: Жареное яйцо с хрустящим беконом.
  components:
  - type: Sprite
    sprite: _radiant/Objects/Consumable/Food/food.rsi
    state: baconegg
  - type: FlavorProfile
    flavors: [radiantBaconEgg]
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 12
        reagents:
        - ReagentId: Nutriment
          Quantity: 6
        - ReagentId: Vitamin
          Quantity: 2

- type: entity
  parent: FoodMealBase
