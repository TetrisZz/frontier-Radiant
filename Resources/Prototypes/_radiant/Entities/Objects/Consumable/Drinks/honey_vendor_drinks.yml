- type: entity
  parent: DrinkEnergyDrinkCan
  id: DrinkBuzzFuzzCan
  name: Buzz Fuzz can
  description: A sweet fizzy drink made with honey. A hive of flavour!
  components:
  - type: Sprite
    sprite: _radiant/Objects/Consumable/Drinks/buzz_fuzz.rsi
  - type: GenericVisualizer
    visuals:
      enum.OpenableVisuals.Opened:
        enum.OpenableVisuals.Layer:
          True: { state: icon }
          False: { state: icon }
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: BuzzFuzz
          Quantity: 30

