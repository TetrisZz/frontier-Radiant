- type: entity
  parent: NFBaseDeathRattleImplant
  id: SeparatistsTrackingImplant
  name: имплант слежения жизни сепаратистов
  description: Имплант отслеживающий состояние своего владельца, в случае критического и смертельного ранения оповестит сепаратистов.
  categories: [ HideSpawnMenu ]
  components:
  - type: RattleOnTrigger
    radioChannel: Separatist

- type: entity
  parent: NFBaseDeathRattleImplant
  id: TrackingImplantNavy
  name: имплант слежения жизни флота
  description: Имплант отслеживающий состояние своего владельца, в случае критического и смертельного ранения оповестит конфедеративный флот.
  categories: [ HideSpawnMenu ]
  components:
  - type: RattleOnTrigger
    radioChannel: Navy

- type: entity
  parent: BaseSubdermalImplant
  id: RadioImplantSeparatists
  name: имплант рации сепаратистов
  description: Имплант даёт доступ к радиочастоте Сепаратистов без гарнитуры.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
  - type: RadioImplant
    radioChannels:
    - Separatist

- type: entity
  parent: NFBaseDeathRattleImplant
  id: EmergencyTrackingImplant
  name: имплант слежения жизни Феникса
  description: Имплант отслеживающий состояние своего владельца, в случае критического и смертельного ранения оповестит Феникс в любой точки галактики.
  categories: [ HideSpawnMenu ]
  components:
  - type: RattleOnTrigger
    radioChannel: Emergency

- type: entity
  parent: BaseSubdermalImplant
  id: ExpeditionRescueMedicalImplant
  name: имплант медицинского отслеживания
  description: An emergency implant that reports rescued expedition casualties to medical.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    permanent: true
    whitelist:
      components:
      - MobState
  - type: ExpeditionRescueMedicalImplant