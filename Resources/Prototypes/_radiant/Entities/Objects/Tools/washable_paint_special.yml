- type: entity
  id: WashablePaintSpecialBase
  parent: WashablePaintCan
  abstract: true
  components:
  - type: Sprite
    sprite: _radiant/Objects/Tools/SprayPaint/mime_white.rsi
    layers:
    - state: capped
      map: [body]
    - state: transparent
      visible: false
      map: [color]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        body:
          True: { state: can }
          False: { state: capped }
        color:
          True: { state: transparent, visible: false }
          False: { state: transparent, visible: false }

- type: entity
  id: WashablePaintMimeWhite
  parent: WashablePaintSpecialBase
  name: white paint
  suffix: Mime
  components:
  - type: PaintCan
    color: "#EEEEEE"

