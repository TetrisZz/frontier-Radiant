- type: entity
  id: ClownLubricantSpray
  parent: BaseItem
  name: lubricant spray
  description: A colourful aerosol can filled with slippery space lubricant.
  components:
  - type: Sprite
    sprite: _radiant/Objects/Tools/SprayPaint/clown_lube.rsi
    layers:
    - state: capped
      map: [body]
  - type: Item
    size: Small
    sprite: _radiant/Objects/Tools/washable_paint_inhands.rsi
  - type: Appearance
  - type: ItemToggle
    verbToggleOn: paint-can-open
    verbToggleOff: paint-can-close
  - type: SpraySafety
    popup: paint-can-capped
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        body:
          True: { state: can }
          False: { state: capped }
  - type: SolutionContainerManager
    solutions:
      spray:
        maxVol: 100
        reagents:
        - ReagentId: SpaceLube
          Quantity: 100
  - type: RefillableSolution
    solution: spray
  - type: SolutionTransfer
    canChangeTransferAmount: true
  - type: SolutionItemStatus
    solution: spray
  - type: ExaminableSolution
    solution: spray
    exactVolume: true
  - type: UseDelay
  - type: Spray
    transferAmount: 5
    sprayVelocity: 2
    spraySound:
      path: /Audio/Effects/spray2.ogg
  - type: Tag
    tags: [Spray, NoWashablePaint]
  - type: StaticPrice
    price: 50
