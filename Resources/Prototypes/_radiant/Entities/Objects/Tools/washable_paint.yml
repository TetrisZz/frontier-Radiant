- type: entity
  abstract: true
  parent: BaseItem
  id: WashablePaintCan
  name: spray paint
  description: Temporary spray paint for clothing and items. Washes off with water, soap or a laundry cycle.
  components:
  - type: GuideHelp
    guides: [RadiantDecorating, RadiantMechanics, Medical]
  - type: Sprite
    sprite: _radiant/Objects/Tools/washable_paint.rsi
    layers:
    - state: capped
      map: [body]
    - state: cap-color
      map: [color]
  - type: Appearance
  - type: ItemToggle
    verbToggleOn: paint-can-open
    verbToggleOff: paint-can-close
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        body:
          True: { state: can }
          False: { state: capped }
        color:
          True: { state: color }
          False: { state: cap-color }
  - type: Item
    size: Small
    sprite: _radiant/Objects/Tools/washable_paint_inhands.rsi
  - type: PaintCan
  - type: StaticPrice
    price: 25

- type: entity
  parent: WashablePaintCan
