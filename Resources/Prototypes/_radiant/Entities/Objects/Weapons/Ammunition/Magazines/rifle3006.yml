#region base .30-60 Springfield
- type: entity
  id: NFBaseMagazineRifle3006
  name: magazine (.30-60 Springfield)
  parent: [ BaseC1Contraband, RecyclableItemSteelTiny, BaseMagazineLightRifle ]
  abstract: true
  components:
  - type: Tag
    tags:
      - NFMagazineRifle3006
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - NFCartridgeRifle3006
    proto: NFCartridgeRifle3006
    capacity: 20
  - type: Sprite
    scale: 0.7, 0.7
    sprite: _radiant/Objects/Weapons/Guns/Ammunition/Magazine/rifle3006_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Item
    sprite: _radiant/Objects/Weapons/Guns/Ammunition/Magazine/rifle3006_mag.rsi
    inhandVisuals:
      left:
      - state: inhand-left-mag
      right:
      - state: inhand-right-mag

#region .30 magazines
- type: entity
  id: NFMagazineRifle3006Empty
  name: magazine (.30-60 Springfield, any)
  parent: NFBaseMagazineRifle3006
  suffix: empty
  components:
  - type: BallisticAmmoProvider
    proto: null

- type: entity
  id: NFMagazineRifle3006
  name: magazine (.30-60 Springfield)
  parent: NFBaseMagazineRifle3006
  components:
  - type: BallisticAmmoProvider
    proto: NFCartridgeRifle3006

- type: entity
  id: NFMagazineRifle3006Overpressure
  name: magazine (.30-60 Springfield, overpressure)
  parent: NFBaseMagazineRifle3006
  components:
  - type: BallisticAmmoProvider
    proto: NFCartridgeRifle3006Overpressure
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: decal-01
      color: "#ff8d00"
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#ff8d00"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#ff8d00"

