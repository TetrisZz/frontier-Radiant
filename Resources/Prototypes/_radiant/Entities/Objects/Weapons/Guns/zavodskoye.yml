# SMG

- type: entity
  name: Вереск
  parent: [ NFBaseGunMeleeAttackMedium, BaseWeaponSubMachineGun ]
  id: WeaponSubMachineGunVereskBlue
  description: Автоматический пистолет пулемет компактного размера, можно использовать как в одной руке, так и держать за рукоятку на цевье, поставляется с магазином ограниченной емкости. Использует патроны .35 авто.
  suffix: Заводской
  components:
  - type: Sprite
    sprite: _radiant/Objects/Weapons/Guns/SMGs/veresk_blue/big.rsi
    scale: 0.90, 0.90
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _radiant/Objects/Weapons/Guns/SMGs/veresk_blue/tiny.rsi
  - type: RareWeapon
    rarity: Unique
  - type: Item
    size: Normal
    shape:
    - 0,0,2,2
    sprite: _radiant/Objects/Weapons/Guns/SMGs/veresk_blue/tiny.rsi
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -3
    maxAngle: -4
    angleDecay: 2
    angleIncrease: -4
  - type: Gun
    fireRate: 7
    minAngle: 4
    maxAngle: 16
    angleIncrease: 5
    angleDecay: 1
    selectedMode: FullAuto
    soundGunshot:
      path: /Audio/_radiant/Weapons/Gunshots/SR2_Fire_Single_Suppressed_01.ogg
      params:
        volume: -2
    availableModes:
    - FullAuto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolSubMachineGunVereskLow
        insertSound:
          path: /Audio/_radiant/Weapons/MagIn/SR2_Reload_Magin.ogg
          params:
            volume: -1.5
        ejectSound:
          path: /Audio/_radiant/Weapons/MagOut/SR2_Reload_Magout.ogg
          params:
            volume: -1.5
        priority: 2
        whitelist:
          tags:
            - MagazineSubMachineGunPistol35Veresk
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: NFCartridgePistol35
        priority: 1
        whitelist:
          tags:
            - NFCartridgePistol35
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

