- type: entity
  name: М-30 Аспид-К
  parent: [ NFBaseWeaponRifleAssaultChamber30, NFBaseWeaponFrameRifleAssaultFrontierGunsmith, WeaponRifleGuardianBlue ]
  id: WeaponRifleGuardianWrittenoff
  description: Продвинутая модификация линейки М-30, созданная для точечной работы на средних дистанциях. Оснащена стабилизированной газоотводной системой и улучшенным компенсатором, благодаря чему практически не даёт увод ствола очередью. Использует 30-й калибр.
  suffix: Списанный
  components:
  - type: Sprite
    sprite: _radiant/Objects/Weapons/Guns/Rifles/guardian/big.rsi
    scale: 0.75, 0.75
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _radiant/Objects/Weapons/Guns/Rifles/guardian/tiny.rsi
  - type: Item
    sprite: _radiant/Objects/Weapons/Guns/Rifles/guardian/tiny.rsi
  - type: RareWeapon
    rarity: UniqueWrittenoff
  - type: GunRequiresWield
  - type: GunWieldBonus
    minAngle: -0
    maxAngle: -0
  - type: Gun
    burstCooldown: 0.7
    fireRate: 3.5
    angleDecay: 3
    angleIncrease: 1
    minAngle: 2
    maxAngle: 8
    projectileSpeed: 30
    soundGunshot:
      path: /Audio/_radiant/Weapons/Gunshots/Fire_guardian.ogg
      params:
        volume: -1
    selectedMode: Burst
    availableModes:
    - Burst
    - FullAuto
    - SemiAuto
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_radiant/Weapons/peredergivanie.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: NFMagazineRifle30
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - NFMagazineRifle30
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: NFCartridgeRifle30
        priority: 1
        whitelist:
          tags:
            - NFCartridgeRifle30
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  id: NFWeaponSubMachineGunWt550RSWrittenoff
