  name: WT-550
  description: |-
    Отличный пистолет-пулемёт, производства NanoTrasen's Small Arms Division. Использует патроны калибра .35 авто.
  suffix: Списанный
  components:
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/SMGs/wt550.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: base-unshaded
        map: ["enum.GunVisualLayers.BaseUnshaded"]
        shader: unshaded
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
      - state: mag-unshaded-0
        map: ["enum.GunVisualLayers.MagUnshaded"]
        shader: unshaded
  - type: Clothing
    sprite: _NF/Objects/Weapons/Guns/SMGs/wt550.rsi
  - type: Gun
    fireRate: 5.2
    minAngle: 2
    maxAngle: 14
    angleIncrease: 1.5
    angleDecay: 6
    projectileSpeed: 23
  - type: RareWeapon
    rarity: UniqueWrittenoff
  - type: MagazineVisuals
    magState: mag
    steps: 6
    zeroVisible: true
  - type: ChamberMagazineAmmoProvider
    boltClosed: null

