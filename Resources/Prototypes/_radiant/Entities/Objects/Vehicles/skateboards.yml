- type: entity
  parent: MarkerBase
  id: RandomSkateboardCargoRS
  name: skateboard
  description: One of two skateboard designs, selected at delivery.
  categories: [ HideSpawnMenu ]
  components:
  - type: RandomSpawner
    offset: 0
    prototypes:
    - VehicleSkateboardRS
    - VehicleSkateboardAltRS

- type: entity
  parent: MarkerBase
  id: RandomHoverboardCargoRS
  name: hoverboard
  description: One of two hoverboard designs, selected at delivery.
  categories: [ HideSpawnMenu ]
