- type: entity
  parent: BaseVehicle
  id: VehicleSkateboardRS
  name: skateboard
  description: A small board on four wheels for fast trips and spectacular falls.
  components:
  - type: Sprite
    sprite: _radiant/Objects/Vehicles/skateboards.rsi
    noRot: true
    layers:
    - state: skateboard
      map: [ "enum.VehicleVisualLayers.AutoAnimate" ]
      autoAnimated: false
  - type: Vehicle
    requiredHands: 0
    engineRunning: true
    renderOver: North, South
    radarBlip: false
    southOffset: 0, -0.1
    northOffset: 0, -0.1
    eastOffset: 0, -0.1
    westOffset: 0, -0.1
  - type: VehicleTrick
    gripPrototype: VehicleTrickSkateboardGripRS
  - type: AnimatedEmotes
  - type: Item
    sprite: _radiant/Objects/Vehicles/skateboard_item.rsi
    size: Huge
    inhandVisuals:
      left:
      - state: inhand-left
        sprite: _radiant/Objects/Vehicles/skateboard_item.rsi
      right:
      - state: inhand-right
        sprite: _radiant/Objects/Vehicles/skateboard_item.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 8
        Structural: 2
    soundHit:
      collection: MetalThud
  - type: MovementSpeedModifier
    acceleration: 8
    friction: 4
    baseSprintSpeed: 5.5
    baseWalkSpeed: 4
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 60
        mask:
        - MobMask
        hard: true
  - type: StaticPrice
    price: 3000

- type: entity
  parent: VehicleSkateboardRS
  id: VehicleSkateboardAltRS
  name: patterned skateboard
  description: A skateboard with a brighter deck for riders who prefer to fall in style.
  components:
  - type: Sprite
    sprite: _radiant/Objects/Vehicles/skateboards.rsi
    noRot: true
    layers:
    - state: skateboard-alt
      map: [ "enum.VehicleVisualLayers.AutoAnimate" ]
      autoAnimated: false
  - type: Item
