  - type: RandomSpawner
    offset: 0
    prototypes:
    - VehicleHoverboardRS
    - VehicleHoverboardCorporateRS

- type: entity
  parent: CrateLivestock
  id: CrateFunHoverboardRS
  name: hoverboard crate
  description: A transport crate containing one of two hoverboard models.
  components:
  - type: StorageFill
    contents:
    - id: VehicleHoverboardRS
      prob: 1
      orGroup: HoverboardRS
    - id: VehicleHoverboardCorporateRS
      prob: 1
      orGroup: HoverboardRS
