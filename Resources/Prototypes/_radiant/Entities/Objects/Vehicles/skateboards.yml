    inhandVisuals:
      left:
      - state: inhand-left
        sprite: _radiant/Objects/Vehicles/skateboard_alt_item.rsi
      right:
      - state: inhand-right
        sprite: _radiant/Objects/Vehicles/skateboard_alt_item.rsi
  - type: VehicleTrick
    gripPrototype: VehicleTrickSkateboardAltGripRS

- type: entity
  parent: BaseVehicle
  id: VehicleHoverboardRS
  name: red hoverboard
  description: A fast antigravity board that glides just above the floor.
  components:
  - type: Sprite
    sprite: _radiant/Objects/Vehicles/skateboards.rsi
    noRot: true
    layers:
    - state: hoverboard-red
      map: [ "enum.VehicleVisualLayers.AutoAnimate" ]
      autoAnimated: false
  - type: Vehicle
    requiredHands: 1
    engineRunning: true
    renderOver: North, South
    radarBlip: true
    southOffset: 0, -0.1
    northOffset: 0, -0.1
    eastOffset: 0, -0.1
    westOffset: 0, -0.1
  - type: VehicleTrick
    gripPrototype: VehicleTrickHoverboardGripRS
  - type: AnimatedEmotes
  - type: Item
    sprite: _radiant/Objects/Vehicles/hoverboard_red_item.rsi
    size: Huge
    inhandVisuals:
      left:
      - state: inhand-left
        sprite: _radiant/Objects/Vehicles/hoverboard_red_item.rsi
      right:
      - state: inhand-right
        sprite: _radiant/Objects/Vehicles/hoverboard_red_item.rsi
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 9
        Structural: 2
    soundHit:
      collection: MetalThud
  - type: Tag
    tags:
    - DoorBumpOpener
    - DemagImmune
  - type: MovementIgnoreGravity
  - type: AmbientSound
    sound: /Audio/Effects/shuttle_thruster.ogg
    range: 8
    volume: 5
    enabled: false
  - type: MovementSpeedModifier
    acceleration: 10
    friction: 5
    baseSprintSpeed: 7
    baseWalkSpeed: 5.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.3
        density: 60
        mask:
        - MobMask
        hard: true
  - type: StaticPrice
    price: 15000

- type: entity
  id: VehicleTrickSkateboardGripRS
