- type: entity
  parent: BaseItem
  id: DonorDecisionToken
  name: decision token
  description: Two sides, one decision. The token accepts no responsibility for the consequences.
  components:
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_radiant/Items/handling/coin_pickup.wav
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_radiant/Items/handling/coin_drop.wav
      params:
        volume: -4
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_radiant/Items/handling/coin_drop.wav
      params:
        volume: -4
  - type: Sprite
    sprite: _radiant/Objects/Fun/decision_token.rsi
    scale: 0.5, 0.5
    state: icon
  - type: Item
    size: Tiny
  - type: DonorTrinket
  - type: UseDelay
    delay: 2
