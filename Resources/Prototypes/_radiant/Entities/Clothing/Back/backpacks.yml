- type: entity
  parent: [NFClothingBackpack, BaseC2Contraband ]
  id: ClothingBackpackAcorp
  name: черно-белый рюкзак
  description: Чёрно-белый рюкзак, который предназначен для сотрудников акорп, в него поместится всё необходимое для вашей работы.
  components:
  - type: Sprite
    sprite: _radiant/Clothing/Back/Backpacks/acorp.rsi

- type: entity
  parent: NFClothingBackpack
  id: ClothingBackpackAcorpSecurity
  name: рюкзак секьюрити
  description: Рюкзак, который предназначен для акорп секьюрити, в него поместится всё необходимое для вашей работы.
  components:
  - type: Sprite
    sprite: _radiant/Clothing/Back/Backpacks/sec.rsi

- type: entity
  parent: NFClothingBackpack
  id: ClothingBackpackSeparatist
  name: рюкзак сепаратиста
  description: Рюкзак, который изготовлен из дешёвой, но достаточно прочной ткани. Пахнет железом.
  components:
  - type: Sprite
    sprite: _radiant/Clothing/Back/Backpacks/backpacksep.rsi

- type: entity
  parent: NFClothingBackpack
  id: ClothingBackpackMeowSkin
  name: нераспакованная сумка
  description: Лишь чехол, чтобы поместить в него другую сумку.
  components:
  - type: Sprite
    sprite: _radiant/Clothing/Back/Backpacks/meow.rsi
  - type: Tag
    tags:
    - BackpackMeowSkin
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,1,1

- type: entity
  parent: NFClothingBackpack
  id: ClothingBackpackMeow
  categories: [ HideSpawnMenu ]
  name: рюкзак meow
  description: Рюкзак, который просто meow.
  components:
  - type: Sprite
    sprite: _radiant/Clothing/Back/Backpacks/meow.rsi
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,7,7 # Frontier: Was 0,0,19,9
  - type: Construction
    graph: BlueSpaceBagSkinCrafting
    node: start

- type: entity
  parent: [ClothingBackpack, BaseCentcommContraband]
  id: ClothingBackpackProsecutor
  name: рюкзак прокурора
  description: В нём явно хранятся ордера или три килограмма конфискованного коньяка. Прокурор всё отрицает, но внутри подозрительно звенит.
  components:
  - type: Sprite
    sprite: _radiant/Clothing/Back/Backpacks/prosecutor.rsi
  - type: Tag
    tags:
    - WhitelistChameleon
