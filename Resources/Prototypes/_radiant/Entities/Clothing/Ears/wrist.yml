- type: entity
  parent: NFBaseClothingWristset
  id: NFClothingWristsetAcorpBlack
  name: наручная рация Acorp
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#000000"
    - state: icon-unshaded
      color: "#131415"
      shader: unshaded
    - state: icon-buttons
  - type: Clothing
    clothingVisuals:
      ears:
      - state: equipped-EARS
        color: "#000000"
      - state: equipped-EARS-unshaded
        color: "#131415"
        shader: unshaded
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyAcorp
      - EncryptionKeyCommon

