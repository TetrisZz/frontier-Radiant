# Corp sofa
- type: entity
  name: grey sofa
  id: BenchSofaWhiteMiddle
  parent: BenchBaseMiddle
  components:
  - type: Sprite
    sprite: _radiant/Structures/Furniture/sofa.rsi
  - type: Construction
    graph: RadiantSofasGraph
    node: BenchSofaWhiteMiddleNode
  - type: StaticPrice # Frontier
    price: 25 # Frontier: 25

- type: entity
  id: BenchSofaWhiteLeft
  suffix: Left
  parent: BenchSofaWhiteMiddle
  components:
  - type: Sprite
    sprite: _radiant/Structures/Furniture/sofa.rsi
    state: left
  - type: Construction
    graph: RadiantSofasGraph
    node: BenchSofaWhiteLeftNode

- type: entity
  id: BenchSofaWhiteRight
  suffix: Right
  parent: BenchSofaWhiteMiddle
  components:
  - type: Sprite
    sprite: _radiant/Structures/Furniture/sofa.rsi
    state: right
  - type: Construction
    graph: RadiantSofasGraph
    node: BenchSofaWhiteRightNode

- type: entity
  name: grey sofa
  id: BenchSofaWhiteCorner
  suffix: Corner
#  parent: BenchSofaCorpMiddle
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Sprite
    sprite: _radiant/Structures/Furniture/sofa.rsi
    state: corner
  - type: Clickable
  - type: InteractionOutline
  - type: Pullable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Construction
    graph: RadiantSofasGraph
    node: BenchSofaWhiteCornerNode