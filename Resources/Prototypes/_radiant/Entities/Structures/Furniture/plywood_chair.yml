- type: entity
  parent: ChairBase
  id: ChairPlywood
  name: plywood armchair
  description: A comfortable armchair made from curved plywood.
  components:
  - type: Sprite
    sprite: _radiant/Structures/Furniture/plywood_chair.rsi
    layers:
    - state: chair
    - state: armrest
  - type: Construction
    graph: RadiantPlywoodChair
    node: chair
  - type: Damageable
    damageModifierSet: Wood

- type: construction
  id: RadiantPlywoodChair
  graph: RadiantPlywoodChair
  startNode: start
  targetNode: chair
  category: construction-category-furniture
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
  conditions:
  - !type:TileNotBlocked

- type: constructionGraph
  id: RadiantPlywoodChair
  start: start
  graph:
  - node: start
    actions:
    - !type:DestroyEntity {}
    edges:
    - to: chair
      steps:
      - material: WoodPlank
        amount: 4
        doAfter: 2
  - node: chair
    entity: ChairPlywood
    edges:
    - to: start
      steps:
      - tool: Prying
        doAfter: 2
      completed:
      - !type:SpawnPrototype
        prototype: MaterialWoodPlank1
        amount: 4
