- type: entity
  id: RadiantFloorLight
  parent: PoweredLightPostSmallEmpty
  suffix: ""
  name: recessed floor light
  description: An electric light fixture with a replaceable bulb.
  components:
  - type: Sprite
    sprite: _radiant/Structures/Lighting/floor_light.rsi
    drawdepth: FloorObjects
    noRot: true
    state: on
    layers:
    - state: on
      map: ["enum.PoweredLightLayers.Base"]
  - type: PoweredLight
    bulb: Bulb
    hasLampOnSpawn: LightBulb
  - type: PoweredLightVisuals
    spriteStateMap:
      empty: empty
      off: on
      on: on
      broken: broken
      burned: burned
  - type: PointLight
    enabled: true
    radius: 6
    energy: 1
    softness: 1.1
    color: "#FFD1A3"
    offset: 0, 0
  - type: Construction
    graph: RadiantDecorativeLighting
    node: floor
  - type: Physics
    canCollide: false
  placement:
    mode: SnapgridCenter

- type: entity
  id: RadiantLampPost
  parent: PoweredLightPostSmallEmpty
  suffix: ""
  name: decorative lamp post
  description: An electric light fixture with a replaceable bulb.
  components:
  - type: Sprite
    sprite: _radiant/Structures/Lighting/decorative_lamp_post.rsi
    drawdepth: Overdoors
    noRot: true
    scale: 1, 1
    offset: 0, 0.5
    state: base
    layers:
    - state: base
      map: ["enum.PoweredLightLayers.Base"]
  - type: PoweredLight
    bulb: Bulb
    hasLampOnSpawn: LightBulb
  - type: PoweredLightVisuals
    spriteStateMap:
      empty: base
      off: base
      on: base
      broken: base
      burned: base
  - type: PointLight
    enabled: true
    radius: 6
    energy: 1
    softness: 1.1
    color: "#FFD1A3"
    offset: 0, 0 # Light offsets move across the map, not up the pole sprite.
  - type: Construction
    graph: RadiantDecorativeLighting
    node: post
  placement:
    mode: SnapgridCenter

