- type: entity
  id: RadiantLampPostBare
  parent: LightPostSmall
  name: bare lamp post
  description: A metal post without a lamp head.
  suffix: ""
  components:
  - type: Sprite
    sprite: _radiant/Structures/Lighting/ornate_lamp_post.rsi
    drawdepth: Overdoors
    noRot: true
    scale: 1, 1
    offset: 0, 2
    state: base
    layers:
    - state: base
  - type: PointLight
    enabled: false
  placement:
    mode: SnapgridCenter

- type: entity
  id: RadiantLampPostAdditionalBase
  abstract: true
  parent: RadiantLampPostBare
  name: decorative lamp post
  description: An electric light fixture with a replaceable bulb.
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.PoweredLightLayers.Base"]
  - type: PoweredLight
    bulb: Bulb
    hasLampOnSpawn: LightBulb
  - type: ContainerContainer
    containers:
      light_bulb: !type:ContainerSlot
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: SmartLight
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports: [On, Off, Toggle]
  - type: Appearance
  - type: PoweredLightVisuals
  - type: PointLight
    enabled: true
    radius: 15
    energy: 2
    softness: 1.1
    color: "#FFD1A3"
    offset: 0, 0 # Keep the light on its tile; Sprite.offset only raises the artwork.

- type: entity
  id: RadiantLampPostChinese
  parent: RadiantLampPostAdditionalBase
  name: lantern sign post
  components:
  - type: Sprite
    state: chinese
    layers:
    - state: chinese
      map: ["enum.PoweredLightLayers.Base"]
  - type: PoweredLightVisuals
    spriteStateMap:
      empty: chinese
      off: chinese
      on: chinese
      broken: chinese
      burned: chinese

