# Additional Radiant furniture. It has no recipes and is available only via
# mapping or entity spawning.

- type: entity
  id: FilingCabinetRadiant
  parent: filingCabinet
  name: картотечный шкаф
  components:
  - type: Sprite
    sprite: _radiant/Structures/Storage/filing_cabinets.rsi
    state: filingcabinet
    layers:
    - state: filingcabinet
    - state: filingcabinet-open
      map: ["openLayer"]

- type: entity
  id: ChestDrawerRadiant
  parent: filingCabinetDrawer
  name: комод
  components:
  - type: Sprite
    sprite: _radiant/Structures/Storage/filing_cabinets.rsi
    state: chestdrawer
    layers:
    - state: chestdrawer
    - state: chestdrawer-open
      map: ["openLayer"]

- type: entity
  id: TallCabinetRadiant
  parent: filingCabinetTall
  name: высокий картотечный шкаф
  components:
  - type: Sprite
    sprite: _radiant/Structures/Storage/filing_cabinets.rsi
    state: tallcabinet
    layers:
    - state: tallcabinet
    - state: tallcabinet-open
      map: ["openLayer"]

- type: entity
  id: EmploymentCabinet
  parent: filingCabinet
  name: картотечный шкафчик
  description: Шкаф для личных дел и кадровых документов.
  components:
  - type: Sprite
    sprite: _radiant/Structures/Storage/filing_cabinets.rsi
    state: employmentcabinet
    layers:
    - state: employmentcabinet
    - state: employmentcabinet-open
      map: ["openLayer"]
