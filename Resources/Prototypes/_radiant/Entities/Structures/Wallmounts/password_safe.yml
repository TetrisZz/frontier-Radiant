- type: entity
  parent: BaseWallmountMetallic
  id: PasswordWallSafeFrame
  name: wall safe frame
  description: An unfinished wall safe. It needs steel, cable, a control board and a screwdriver.
  components:
  - type: Sprite
    sprite: _radiant/Structures/Wallmounts/safe.rsi
    state: safe0
  - type: Construction
    graph: PasswordWallSafe
    node: frame

- type: entity
  parent: BaseWallmountMetallic
  id: PasswordWallSafe
  name: wall safe
  description: A reinforced wall safe with a digital combination lock.
  components:
  - type: Sprite
    sprite: _radiant/Structures/Wallmounts/safe.rsi
    layers:
    - state: safe
      map: [safe]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PasswordSafeVisuals.State:
        safe:
          Closed: { state: safe }
          Open: { state: safe0 }
          Locking: { state: safeb }
          Sparking: { state: safespark }
  - type: PasswordSafe
  - type: PasswordSafeCode
  - type: HLPersistOnShipSave
    saveContents: true
  - type: ShipSaveLimit
    limitId: PasswordWallSafe
  - type: Lock
    locked: true
    unlockOnClick: false
    showLockVerbs: false
    breakOnAccessBreaker: false
  - type: LockedStorage
  - type: LockedAnchorable
  - type: Storage
    openOnActivate: false
    maxItemSize: Normal
    grid:
    - 0,0,6,4
  - type: ContainerContainer
    containers:
      storagebase: !type:Container {}
  - type: ActivatableUI
    key: enum.PasswordSafeUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PasswordSafeUiKey.Key:
        type: PasswordSafeBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Construction
    graph: PasswordWallSafe
    node: safe
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel:
            min: 2
            max: 2
      - !type:DoActsBehavior
        acts: [Destruction]
  - type: Tag
    tags:
    - Structure
    - DemagImmune
