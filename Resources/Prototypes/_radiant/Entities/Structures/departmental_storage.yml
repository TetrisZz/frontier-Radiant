- type: entity
  id: RadiantDepartmentalClosetBase
  parent: ClosetSteelBase
  abstract: true
  name: шкафчик
  description: Высокий металлический шкаф для хранения снаряжения.
  components:
  - type: Icon
    sprite: _radiant/Structures/Storage/departmental_lockers.rsi
    state: med
  - type: Sprite
    sprite: _radiant/Structures/Storage/departmental_lockers.rsi
    layers:
    - state: med
      map: ["enum.StorageVisualLayers.Base"]
    - state: med_door
      map: ["enum.StorageVisualLayers.Door"]
    - state: welded
      visible: false
      map: ["enum.WeldableLayers.BaseWelded"]
    - state: locked
      visible: false
      offset: "0,0.375"
      map: ["enum.LockVisualLayers.Lock"]
    - state: paper
      visible: false
      sprite: Structures/Storage/closet_labels.rsi
      map: ["enum.PaperLabelVisuals.Layer"]
  - type: EntityStorageVisuals
    stateBaseClosed: med
    stateDoorClosed: med_door
    stateDoorOpen: med_open

