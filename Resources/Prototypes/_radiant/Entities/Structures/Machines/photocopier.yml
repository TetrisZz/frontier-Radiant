- type: entity
  parent: BaseMachinePowered
  id: Photocopier
  name: photocopier
  description: Prints standard forms and copies paper documents. Refill with paper sheets and toner.
  components:
  - type: Sprite
    sprite: _radiant/Structures/Machines/photocopier.rsi
    layers:
    - state: photocopier
      map: ["body"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PhotocopierVisuals.Printing:
        body:
          True: { state: photocopier1 }
          False: { state: photocopier }
  - type: Photocopier
    printDuration: 2
    # Available documentForm IDs. Use [] to allow copying originals only.
    forms:
    - GeneralDocument
    - SalaryRequest
    - MercenaryLicense
    - ArrestWarrant
    - SearchWarrant
    - FineNotice
    - AcorpDocument
    - AcorpWorkReport
    - AcorpArtifactReport
    - AcorpAnomalyReport
    - ShuttleCrewContract
    - ExpeditionReport
    - CargoHandover
    - MedicalConsent
    - MedicalExamination
    - MedicalReferral
    - MedicalSurgeryReport
    - MedicalDischarge
    - MedicalPrescription
    - MedicalDeathCertificate
  - type: PhotocopierBodyScanner
    malePrint: PaperBodyPrintMale
    femalePrint: PaperBodyPrintFemale
    siliconPrint: PaperBodyPrintMachine
    speciesPrints:
      Reptilian: PaperBodyPrintLizard
      Vox: PaperBodyPrintLizard
      SlimePerson: PaperBodyPrintSlime
      Felinid: PaperBodyPrintCat
      Vulpkanin: PaperBodyPrintFluffy
      Tajaran: PaperBodyPrintFluffy
      Shadowkin: PaperBodyPrintFluffy
  - type: ApcPowerReceiver
    powerLoad: 250
  - type: ActivatableUI
    key: enum.PhotocopierUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.PhotocopierUiKey.Key:
        type: PhotocopierBoundUserInterface
  - type: ItemSlots
    slots:
      original:
        name: photocopier-original
        whitelist:
          components: [Paper]
        insertSound: /Audio/Machines/scanning.ogg
        ejectSound: /Audio/Machines/tray_eject.ogg
  - type: ContainerContainer
    containers:
      original: !type:ContainerSlot
  - type: PhysicalComposition
    materialComposition:
      Steel: 1500
      Glass: 500
  - type: Construction
    graph: Photocopier
    node: finished

- type: entity
  parent: BaseItem
  id: PrinterToner
  name: printer toner
  description: A cartridge for refilling a photocopier.
  components:
  - type: Sprite
    sprite: _radiant/Objects/Devices/printer_toner.rsi
    state: toner
  - type: Item
    size: Small
  - type: PrinterToner
  - type: StaticPrice
    price: 50
