- type: entity
  id: RadiantSpaceVillainArcade
  parent: BaseStructure
  name: forgotten arcade machine
  description: A forgotten arcade cabinet. Its controls no longer respond.
  components:
  - type: Sprite
    sprite: Structures/Machines/arcade.rsi
    layers:
    - state: arcade
    - state: screen_spacevillain
      color: "#555555"
  - type: Icon
    sprite: Structures/Machines/arcade.rsi
    state: arcade
  - type: Anchorable
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: StaticPrice
    price: 300
