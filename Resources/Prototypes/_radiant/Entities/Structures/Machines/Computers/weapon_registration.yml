# Weapon registration console: issues a serial number and enters the weapon
# into the local database of the current round. (Radiant sector)
- type: entity
  parent: BaseComputer
  id: ComputerWeaponRegistration
  name: консоль регистрации оружия
  description: Вставьте огнестрельное оружие, чтобы зарегистрировать его и получить серийный номер.
  components:
  - type: WeaponRegistrationConsole
    weaponSlot:
      name: weapon-registration-slot-name
      insertOnInteract: true
      ejectOnUse: true
      ejectOnBreak: true
      whitelistFailPopup: weapon-registration-not-weapon
      whitelist:
        components:
        - Gun
  # Console window: summary of the weapon in the slot + an "Owner" field + a
  # "Save" button. Its own UI key (WeaponRegistrationConsoleUiKey), client-side
  # window class.
  - type: ActivatableUI
    key: enum.WeaponRegistrationConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.WeaponRegistrationConsoleUiKey.Key:
        type: WeaponRegistrationConsoleBoundUserInterface
