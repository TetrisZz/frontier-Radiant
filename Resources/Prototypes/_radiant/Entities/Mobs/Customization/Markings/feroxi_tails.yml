- type: marking
  id: FeroxiTailAngular
  bodyFeatures: [Tail]
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Feroxi]
  coloring:
    default:
      type: !type:SkinColoring
    layers:
      tail_details:
        type: !type:SimpleColoring
          color: "#545C6F"
      tail_tips:
        type: !type:SimpleColoring
          color: "#FFFFFF"
  sprites:
  - sprite: _radiant/Mobs/Customization/Feroxi/angular_tail.rsi
    state: tail_body
  - sprite: _radiant/Mobs/Customization/Feroxi/angular_tail.rsi
    state: tail_details
  - sprite: _radiant/Mobs/Customization/Feroxi/angular_tail.rsi
    state: tail_tips

