- type: entity
  id: MobJudaEmotionalSupport
  parent: [NFMobPet, MobCorgiGhost]
  name: Джуда
  description: Похожая на банан ручная акула. Смешно перебирает лапками и успокаивающе булькает.
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _radiant/Mobs/Pets/juda.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base", "movement"]
      state: juda
  - type: SpriteMovement
    movementLayers:
      movement:
        state: juda-moving
    noMovementLayers:
      movement:
        state: juda
  - type: DamageStateVisuals
    states:
      Alive:
        Base: juda
      Critical:
        Base: juda_dead
      Dead:
        Base: juda_dead
  - type: Grammar
    attributes:
      proper: true
      gender: male
  - type: RandomMetadata
    nameSegments: null
  - type: InteractionPopup
    interactSuccessString: petting-success-dog
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      collection: JudaHappySounds
  - type: Speech
    speechVerb: Slime
    speechSounds: Slime
    allowedEmotes: ['Bark', 'Growl', 'Whine', 'Bubble', 'Squish', 'Pop']
  - type: ReplacementAccent
    accent: Juda
  - type: Vocal
    sounds:
      Male: Juda
      Female: Juda
      Unsexed: Juda
  - type: Vocalizer
    minVocalizeInterval: 2m
    maxVocalizeInterval: 5m
    hideChat: true
  - type: DatasetVocalizer
    dataset: JudaChatter

- type: entity
  id: SpawnMobJudaEmotionalSupport
  parent: MarkerBase
  name: Juda spawner
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: _radiant/Mobs/Pets/juda.rsi
      state: juda
  - type: RandomSpawner
    prototypes:
    - MobJudaEmotionalSupport
    chance: 1
    offset: 0
    deleteSpawnerAfterSpawn: true
