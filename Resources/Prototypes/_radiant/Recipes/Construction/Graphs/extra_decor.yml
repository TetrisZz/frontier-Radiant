- type: constructionGraph
  id: RadiantSmallStairs
  start: start
  graph:
  - node: start
    edges:
    - to: finished
      steps:
      - material: Steel
        amount: 2
        doAfter: 2
  - node: finished
    entity: RadiantSmallStairs
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 2
      - !type:DeleteEntity {}
      steps:
      - tool: Screwing
        doAfter: 2

