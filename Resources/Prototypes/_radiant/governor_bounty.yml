# Governor bounty paper manifest, spawned when a bounty is accepted.
- type: entity
  id: PaperGovernorBountyManifest
  parent: PaperCargoInvoice
  name: governor bounty reminder
  description: A paper reminding you of the bounty you agreed to fulfill.
  components:
  - type: Sprite
    layers:
    - state: paper
      color: "#cfe3f5"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#cfe3f5"

# Governor bounty console: accept bounties and drop the goods into the slot.
- type: entity
  id: ComputerGovernorBounty
  parent: BaseComputer
  name: governor bounty computer
  description: Accept yer governor bounties here, then drop the goods into the slot and redeem them.
  components:
  - type: Sprite
    sprite: _NF/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer_blackmarket
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: piratebounty
    - map: ["computerLayerKeys"]
      state: blackmarket_key
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open
  - type: GovernorBountyConsole
    itemContainer: governor_item_slot
  - type: ItemSlots
    slots:
      governor_item_slot:
        insertOnInteract: true
        ejectOnUse: true
  - type: ActivatableUI
    key: enum.GovernorConsoleUiKey.Bounty
  - type: UserInterface
    interfaces:
      enum.GovernorConsoleUiKey.Bounty:
        type: GovernorBountyConsoleBoundUserInterface
  - type: Computer
    board: Null
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25"

