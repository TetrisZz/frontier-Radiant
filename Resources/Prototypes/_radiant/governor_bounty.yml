# Governor bounty paper manifest, spawned when a bounty is accepted.
- type: entity
  id: PaperGovernorBountyManifest
  parent: PaperCargoInvoice
  name: напоминание о награде губернатора
  description: Бумажка, чтобы вы не забыли.
  components:
  - type: Sprite
    layers:
    - state: paper
      color: "#cfe3f5"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#cfe3f5"

# Governor bounty console: accept bounties and drop the goods into the slot.
- type: entity
  id: ComputerGovernorBounty
  parent: BaseComputer
  name: консоль заданий губернатора
  description: Сюда поступают всякие экзотические запросы от конфедеративного командования. Эти запросы необязательны, но все таки быть на хорошем счете у начальства всегда хорошо, верно?
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: request
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: GovernorBountyConsole
    itemContainer: governor_item_slot
  - type: ItemSlots
    slots:
      governor_item_slot:
        insertOnInteract: true
        ejectOnUse: true
  - type: ActivatableUI
    key: enum.GovernorConsoleUiKey.Bounty
  - type: UserInterface
    interfaces:
      enum.GovernorConsoleUiKey.Bounty:
        type: GovernorBountyConsoleBoundUserInterface
  - type: Computer
    board: Null
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#b89f25"

