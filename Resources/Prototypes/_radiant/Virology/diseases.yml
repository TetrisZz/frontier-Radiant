- type: radiantDisease
  id: StationFever
  name: virology-disease-StationFever
  description: virology-description-StationFever
  reagent: CultureStationFever
  route: droplet

- type: reagent
  id: CultureStationFever
  name: reagent-name-culture-StationFever
  desc: reagent-desc-virology-culture
  physicalDesc: reagent-physical-desc-cloudy
  flavor: bitter
  color: "#ADBF54"
  metabolisms:
    Poison:
      metabolismRate: 0.1
      effects: []

- type: entity
  id: VirologyCultureStationFever
  parent: BaseChemistryEmptyBottle
  name: laboratory culture
  description: A sealed laboratory bottle bearing a biohazard label.
  suffix: StationFever, ADMIN
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: CultureStationFever
          Quantity: 10

