# Radiant sector: single-use sterile packaging for surgical organs, implants and cyberlimbs.
# Use a package in hand to unwrap its contents; pricing includes the contained prototype.
- type: entity
  id: BaseStarlightSurgicalPackage
  parent: BaseItem
  abstract: true
  description: Одноразовая стерильная упаковка. Используйте её в руке, чтобы извлечь содержимое.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Medical/cases.rsi
    state: bottlecase
  - type: Item
    size: Small
    sprite: _Starlight/Objects/Specific/Medical/cases.rsi
  - type: SpawnItemsOnUse
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
  id: BaseStarlightCyberlimbPackage
  parent: BaseStarlightSurgicalPackage
  abstract: true
  description: Одноразовый транспортный футляр. Используйте его в руке, чтобы извлечь киберконечность.
  components:
  - type: Sprite
    state: surgerykit
  - type: Item
    size: Large
    shape:
    - 0,0,2,1

