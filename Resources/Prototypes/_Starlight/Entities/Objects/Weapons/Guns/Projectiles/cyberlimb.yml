# Radiant sector: projectile-compatible version for Frontier's older gun implementation.
- type: entity
  parent: BaseBullet
  id: RadOrb
  name: радиационная сфера
  categories: [ HideSpawnMenu ]
  components:
    - type: FlyBySound
      sound:
        collection: EnergyMiss
        params:
          volume: 5
    - type: PointLight
      enabled: true
      color: "#38c23f"
      radius: 2
      energy: 7
    - type: Sprite
      sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
      layers:
      - state: bluespace
        shader: unshaded
        color: "#80c000"
    - type: Ammo
      muzzleFlash: null
    # Radiant sector: RadOrb needs its source collision fixture. BaseBullet's
    # BulletImpassable mask caused the slow orb to be consumed at the cyberarm.
    - type: Physics
    - type: Fixtures
      fixtures:
        projectile:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.2,-0.2,0.2,0.2"
          hard: false
          mask:
          - Opaque
        fly-by:
          shape: !type:PhysShapeCircle
            radius: 1.5
          layer:
          - Impassable
          - MidImpassable
          - HighImpassable
          - LowImpassable
          hard: false
    - type: Projectile
      damage:
        types:
          Radiation: 20
      impactEffect: BulletImpactEffectDisabler
      ignoreShooter: true
      armingTime: 0.5
    - type: TimedDespawn
      lifetime: 10
    - type: Reflective
      reflective:
        - Energy
