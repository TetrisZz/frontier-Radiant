# Safety Deposit Box Entities

# Base parent for all safety deposit boxes
- type: entity
  id: SafetyDepositBoxBase
  abstract: true
  parent: BaseStorageItem
  components:
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        base:
          True: { state: icon-open }
          False: { state: icon }
  - type: Storage
    blacklist:
      components:
      - IdCard
      - Passport
      - ServiceCredential
      - Currency
      - Store
      - EncryptionKey
      - Implant
      - Storage
      - SafetyDepositBox
      tags:
      - Unstashable
  - type: SafetyDepositBox
  - type: Appearance
  - type: Tag
    tags:
    - SafetyDepositBox

- type: entity
  id: SafetyDepositBoxSmall
  name: safety deposit box (small)
  description: A secure box with a 4x4 main compartment and small pockets. Holds 25 storage cells.
  parent: SafetyDepositBoxBase
  components:
  - type: Sprite
    sprite: _WF/Objects/Economy/depositboxsmall.rsi
    state: icon
  - type: Item
    size: Small
  - type: SafetyDepositBox
    cost: 150000
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,3,3
    - 0,5,2,5
    - 4,5,4,7
    - 0,7,2,7

- type: entity
  id: SafetyDepositBoxMedium
  name: safety deposit box (medium)
  description: A secure box with two 4x4 compartments and equipment pockets. Holds 41 storage cells.
  parent: SafetyDepositBoxBase
  components:
  - type: Sprite
    sprite: _WF/Objects/Economy/depositboxmedium.rsi
    state: icon
  - type: Item
    size: Normal
  - type: SafetyDepositBox
    cost: 300000
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,3,7
    - 6,0,7,0
    - 6,2,7,2
    - 6,4,7,4
    - 6,6,7,6
    - 6,7,6,7

- type: entity
  id: SafetyDepositBoxLarge
  name: safety deposit box (large)
  description: A secure box with two 4x4 compartments and expanded equipment pockets. Holds 48 storage cells.
  parent: SafetyDepositBoxBase
  components:
  - type: Sprite
    sprite: _WF/Objects/Economy/depositboxlarge.rsi
    state: icon
  - type: Item
    size: Large
  - type: SafetyDepositBox
    cost: 400000
  - type: Storage
    maxItemSize: Huge
    grid:
    - 0,0,3,7
    - 5,0,7,1
    - 7,2,7,2
    - 6,3,7,4
    - 6,6,7,7
    - 5,7,5,7

- type: entity
  id: SafetyDepositConsole
  name: safety deposit box console
  description: "A console for purchasing and managing safety deposit boxes."
  parent: BaseStructure
  components:
  - type: GuideHelp
    guides: [RadiantStorage, RadiantMechanics, Medical]
  - type: Sprite
    netsync: false
    noRot: true
    sprite: _WF/Structures/Machines/atm/depositatm.rsi
    layers:
    - map: ["computerLayerBody"]
      state: icon
    - map: ["computerLayerScreen"]
      state: unshaded
  - type: SafetyDepositConsole
    smallBoxProto: SafetyDepositBoxSmall
    mediumBoxProto: SafetyDepositBoxMedium
    largeBoxProto: SafetyDepositBoxLarge
    boxSlot:
      name: safety-deposit-console-boxSlot
      insertSound: /Audio/Machines/scanning.ogg
      ejectSound: /Audio/Machines/tray_eject.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        tags:
        - SafetyDepositBox
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      safety-deposit-console-boxSlot: !type:ContainerSlot
  - type: ActivatableUI
    key: enum.SafetyDepositConsoleUiKey.Key
    singleUser: true
  - type: InteractionOutline
  - type: UserInterface
    interfaces:
      enum.SafetyDepositConsoleUiKey.Key:
        type: SafetyDepositConsoleBoundUserInterface
  - type: Anchorable
  - type: Pullable
