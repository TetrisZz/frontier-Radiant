# Goob Station: Feroxi species, adapted for Radiant Sector.
- type: entity
  parent: BaseMobSpeciesOrganic
  id: BaseMobFeroxi
  name: Урист МакФин
  abstract: true
  save: false
  components:
  - type: HumanoidAppearance
    species: Feroxi
    hideLayersOnEquip: [Snout]
  - type: Hunger
  - type: Thirst
  - type: Icon
    sprite: _Goobstation/Mobs/Species/Feroxi/parts.rsi
    state: full
  - type: Body
    prototype: Feroxi
    requiredLegs: 2
  - type: Speech
    speechSounds: Tenor
    speechVerb: Feroxi
    allowedEmotes: [Gnash, Ston]
  - type: TTS # Radiant Sector
  - type: Vocal
    sounds: { Male: MaleFeroxi, Female: FemaleFeroxi, Unsexed: MaleFeroxi }
  - type: Inventory
    speciesId: feroxi
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32: { sprite: _White/Mobs/Species/displacement.rsi, state: jumpsuit-female }
      shoes:
        sizeMaps:
          32: { sprite: _White/Mobs/Species/displacement.rsi, state: shoes }
    displacements:
      jumpsuit:
        sizeMaps:
          32: { sprite: _White/Mobs/Species/displacement.rsi, state: jumpsuit }
      shoes:
        sizeMaps:
          32: { sprite: _White/Mobs/Species/displacement.rsi, state: shoes }
  - type: Carriable
  - type: Sprite
    netsync: false
    noRot: true
    drawdepth: Mobs
    layers:
