    hidden: true
    soundHit: { path: /Audio/Effects/bite.ogg }
    angle: 30
    animation: WeaponArcBite
    damage: { types: { Piercing: 7 } }
  - type: Tag
    tags: [CanPilot, FootstepSound, DoorBumpOpener, AnomalyHost, FeroxiEmotes]
  - type: Perishable

- type: entity
  parent: BaseMobFeroxi
  id: MobFeroxi
  name: Урист МакФин
