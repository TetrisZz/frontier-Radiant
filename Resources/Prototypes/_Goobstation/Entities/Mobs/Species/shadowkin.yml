# Goob Station: Shadowkin species, adapted for Radiant Sector.
- type: entity
  parent: BaseMobSpeciesOrganic
  id: BaseMobShadowkin
  name: Урист МакШадоу
  abstract: true
  save: false
  components:
  - type: HumanoidAppearance
    species: Shadowkin
  - type: Hunger
  - type: Thirst
  - type: Carriable
  - type: Icon
    sprite: _Goobstation/Mobs/Species/Shadowkin/parts.rsi
    state: full
  - type: Body
    prototype: Shadowkin
    requiredLegs: 2
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
  - type: Flammable
    damage: { types: { Heat: 1.5 } }
  - type: Barotrauma
    # Radiant Sector: pressure causes internal damage without opening bleeding wounds.
    damage: { types: { Cellular: 0.35 } }
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 46
    heatDamageThreshold: 330
    coldDamageThreshold: 195
    coldDamage: { types: { Cold: 0.05 } }
    heatDamage: { types: { Heat: 0.25 } }
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#09070d"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: Bloodstream
    bloodReagent: ShadowkinBlood
  - type: UltraVision
  - type: ShadowkinUltravisionTint # Radiant Sector
  - type: ShadowkinShadeStep # Radiant Sector
  - type: Speech
    allowedEmotes: [Mars, Wurble, ShadowkinMrrp, Ston] # Radiant Sector: separate mrrp emote.
  - type: TTS
  - type: Vocal
    sounds: { Male: MaleShadowkin, Female: FemaleShadowkin, Unsexed: MaleShadowkin }
  - type: Inventory
    speciesId: shadowkin
  - type: Sprite
    netsync: false
    noRot: true
    drawdepth: Mobs
    layers:
    - map: ["enum.HumanoidVisualLayers.Chest"]
    - map: ["enum.HumanoidVisualLayers.Head"]
    - map: ["enum.HumanoidVisualLayers.Snout"]
    - map: ["enum.HumanoidVisualLayers.Eyes"]
