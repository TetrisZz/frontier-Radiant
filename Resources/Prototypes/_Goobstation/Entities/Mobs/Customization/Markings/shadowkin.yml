# Goob Station: core Shadowkin markings, adapted for Radiant Sector.
- type: marking
  id: EarsShadowkin
  bodyFeatures: [Ears]
  bodyPart: HeadTop
  markingCategory: HeadTop
  speciesRestriction: [Shadowkin]
  forcedColoring: true
  sprites:
  - sprite: _Goobstation/Mobs/Customization/Shadowkin/ears.rsi
    state: shadowkin

- type: marking
  id: EarsShadowkinStriped
  bodyFeatures: [Ears]
  bodyPart: HeadTop
  markingCategory: HeadTop
  speciesRestriction: [Shadowkin]
  coloring:
    default:
      type:
        !type:SkinColoring
    layers:
      shadowkin_stripes:
        type:
          !type:SimpleColoring
            color: "#FFFFFF"
  sprites:
  - sprite: _Goobstation/Mobs/Customization/Shadowkin/ears.rsi
    state: shadowkin
  - sprite: _Goobstation/Mobs/Customization/Shadowkin/ears.rsi
    state: shadowkin_stripes

