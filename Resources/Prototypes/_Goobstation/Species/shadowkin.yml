# Goob Station: Shadowkin species definition, adapted for Radiant Sector.
- type: species
  id: Shadowkin
  name: species-name-shadowkin
  roundStart: true
  prototype: MobShadowkin
  sprites: MobShadowkinSprites
  defaultSkinTone: "#FFFFFF"
  markingLimits: MobShadowkinMarkingLimits
  dollPrototype: MobShadowkinDummy
  skinColoration: Hues
  maleFirstNames: NamesVulpkaninMale
  femaleFirstNames: NamesVulpkaninFemale
  lastNames: NamesVulpkaninLast
  minHeight: 0.79444
  maxHeight: 1.05054

- type: speciesBaseSprites
  id: MobShadowkinSprites
  sprites:
    Head: MobShadowkinHead
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Tail: MobShadowkinAnyMarkingFollowSkin
    Chest: MobShadowkinChest
    HeadTop: MobShadowkinAnyMarking
    Eyes: MobShadowkinEyes
    LArm: MobShadowkinLArm
    RArm: MobShadowkinRArm
    LHand: MobShadowkinLHand
    RHand: MobShadowkinRHand
    LLeg: MobShadowkinLLeg
    RLeg: MobShadowkinRLeg
    LFoot: MobShadowkinLFoot
    RFoot: MobShadowkinRFoot

- type: markingPoints
  id: MobShadowkinMarkingLimits
  points:
    Hair: { points: 1, required: false }
    FacialHair: { points: 1, required: false }
    Head: { points: 3, required: false }
    HeadTop: { points: 1, required: true, defaultMarkings: [EarsShadowkin] }
    Chest: { points: 8, required: false }
    Arms: { points: 8, required: false }
    Legs: { points: 8, required: false }
    Tail: { points: 1, required: true, defaultMarkings: [TailShadowkin] }

