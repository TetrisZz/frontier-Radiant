# Goob Station: Shadowkin vocal sounds and emotes, adapted for Radiant Sector.
- type: soundCollection
  id: ShadowkinMars
  files: [/Audio/_Goobstation/Voice/Shadowkin/mar.ogg]
- type: soundCollection
  id: ShadowkinWurbles
  files: [/Audio/_Goobstation/Voice/Shadowkin/wurble.ogg]
- type: soundCollection
  id: ShadowkinMrrps # Radiant Sector
  files:
  - /Audio/_Goobstation/Voice/Shadowkin/mrrp2.ogg
  - /Audio/_Goobstation/Voice/Shadowkin/speak_mrrp_ask.ogg

- type: speechSounds
  id: ShadowkinSpeech # Radiant Sector
  saySound:
    path: /Audio/_Goobstation/Voice/Shadowkin/speak_mrrp_say.ogg
  askSound:
    path: /Audio/_Goobstation/Voice/Shadowkin/speak_mrrp_ask.ogg
  exclaimSound:
    path: /Audio/_Goobstation/Voice/Shadowkin/wurble.ogg

- type: emote
  id: Mars
  name: chat-emote-name-mars
  category: Vocal
  whitelist:
    tags: [ShadowkinEmotes]
  blacklist:
    components: [BorgChassis]
  chatMessages: ["chat-emote-msg-mars"]
  chatTriggers: [mars, marsing, marsed, мурлычет]
- type: emote
  id: Wurble
  name: chat-emote-name-wurble
  category: Vocal
  whitelist:
    tags: [ShadowkinEmotes]
  blacklist:
    components: [BorgChassis]
  chatMessages: ["chat-emote-msg-wurble"]
  chatTriggers: [wurble, wurbles, урчит]
- type: emote
  id: ShadowkinMrrp # Radiant Sector
  name: chat-emote-name-shadowkin-mrrp
  category: Vocal
  whitelist:
    tags: [ShadowkinEmotes]
  blacklist:
    components: [BorgChassis]
  chatMessages: ["chat-emote-msg-shadowkin-mrrp"]
  chatTriggers: [mrrp, mrrps, мурчит, мурчать]

- type: emoteSounds
  id: MaleShadowkin
  # Radiant Sector: no general params here, otherwise they overwrite per-emote volume.
  sounds:
    Scream: { collection: MaleScreams }
    Laugh: { collection: MaleLaugh }
    Sneeze: { collection: MaleSneezes }
    Cough: { collection: MaleCoughs }
    Yawn: { collection: MaleYawn }
    Snore: { collection: Snores }
    Honk: { collection: BikeHorn }
    Sigh: { collection: MaleSigh }
    Crying: { collection: MaleCry }
    Whistle: { collection: Whistles }
    Hiss: { collection: FelinidHisses }
    Meow: { collection: FelinidMeows }
    Mew: { collection: FelinidMews }
    Growl: { collection: FelinidGrowls }
    Purr: { collection: FelinidPurrs }
    Mars: { collection: ShadowkinMars, params: { volume: -4, variation: 0.125 } } # Radiant Sector: quieter purring.
    Wurble: { collection: ShadowkinWurbles, params: { volume: 6, variation: 0.125 } } # Radiant Sector: louder rumbling.
    ShadowkinMrrp: { collection: ShadowkinMrrps, params: { volume: 1, variation: 0.125 } } # Radiant Sector
    Ston: { collection: MaleSton }
    DefaultDeathgasp: { collection: MaleDeathGasp }

- type: emoteSounds
  id: FemaleShadowkin
  # Radiant Sector: no general params here, otherwise they overwrite per-emote volume.
  sounds:
    Scream: { collection: FemaleScreams }
    Laugh: { collection: FemaleLaugh }
    Sneeze: { collection: FemaleSneezes }
    Cough: { collection: FemaleCoughs }
    Yawn: { collection: FemaleYawn }
    Snore: { collection: Snores }
    Honk: { collection: BikeHorn }
    Sigh: { collection: FemaleSigh }
    Crying: { collection: FemaleCry }
    Whistle: { collection: Whistles }
    Hiss: { collection: FelinidHisses }
    Meow: { collection: FelinidMeows }
    Mew: { collection: FelinidMews }
    Growl: { collection: FelinidGrowls }
    Purr: { collection: FelinidPurrs }
    Mars: { collection: ShadowkinMars, params: { volume: -4, variation: 0.125 } } # Radiant Sector: quieter purring.
    Wurble: { collection: ShadowkinWurbles, params: { volume: 6, variation: 0.125 } } # Radiant Sector: louder rumbling.
    ShadowkinMrrp: { collection: ShadowkinMrrps, params: { volume: 1, variation: 0.125 } } # Radiant Sector
    Ston: { collection: FemaleSton }
