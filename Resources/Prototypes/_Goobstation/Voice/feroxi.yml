# Goob Station: Feroxi voice, adapted from the upstream species implementation.
- type: speechVerb
  id: Feroxi
  name: chat-speech-verb-name-feroxi
  speechVerbStrings:
  - chat-speech-verb-feroxi-1
  - chat-speech-verb-feroxi-2
  - chat-speech-verb-feroxi-3
  - chat-speech-verb-feroxi-4

- type: soundCollection
  id: FeroxiGnashes
  files:
  - /Audio/Effects/bite.ogg

- type: emote
  id: Gnash
  name: chat-emote-name-gnash
  category: Vocal
  whitelist:
    tags: [FeroxiEmotes]
  blacklist:
    components: [BorgChassis]
  chatMessages: ["chat-emote-msg-gnash"]
  chatTriggers: [gnash, gnashes, gnashing, gnashed, клацнуть, клацает, клацать, зубами]

- type: emoteSounds
  id: FemaleFeroxi
  params: { variation: 0.125 }
  sounds:
    Scream: { collection: FemaleScreams }
    Laugh: { collection: FemaleLaugh }
    Sneeze: { collection: FemaleSneezes }
    Cough: { collection: FemaleCoughs }
    Yawn: { collection: FemaleYawn }
    Snore: { collection: Snores }
    Honk: { collection: CluwneHorn }
    Sigh: { collection: FemaleSigh }
    Crying: { collection: FemaleCry }
    Whistle: { collection: Whistles }
    Hiss: { path: /Audio/Animals/snake_hiss.ogg }
    Gasp: { collection: FemaleGasp }
    DefaultDeathgasp: { collection: FemaleDeathGasp }
    Ston: { collection: FemaleSton }
    Gnash: { collection: FeroxiGnashes }

- type: emoteSounds
  id: MaleFeroxi
  params: { variation: 0.125 }
  sounds:
    Scream: { collection: MaleScreams }
    Laugh: { collection: MaleLaugh }
    Sneeze: { collection: MaleSneezes }
    Cough: { collection: MaleCoughs }
    Yawn: { collection: MaleYawn }
    Snore: { collection: Snores }
    Honk: { collection: BikeHorn }
    Sigh: { collection: MaleSigh }
    Crying: { collection: MaleCry }
    Whistle: { collection: Whistles }
    Hiss: { path: /Audio/Animals/snake_hiss.ogg }
    Gasp: { collection: MaleGasp }
    DefaultDeathgasp: { collection: MaleDeathGasp }
    Ston: { collection: MaleSton }
    Gnash: { collection: FeroxiGnashes }
