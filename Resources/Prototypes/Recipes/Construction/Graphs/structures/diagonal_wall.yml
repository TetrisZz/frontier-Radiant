- type: constructionGraph
  id: DiagonalWall
  start: start
  graph:
    - node: start
      edges:
        - to: wallDiagonal
          steps:
            - material: Steel
              amount: 4
              doAfter: 3

        - to: reinforcedWallDiagonal
          steps:
            - material: Steel
              amount: 2
              doAfter: 1
            - material: Plasteel
              amount: 4
              doAfter: 2

    - node: wallDiagonal
      entity: WallSolidDiagonal
      edges:
        - to: girder
          completed:
            - !type:GivePrototype
              prototype: SheetSteel1
              amount: 2
          steps:
            - tool: Welding
              doAfter: 10

    - node: reinforcedWallDiagonal
      entity: WallReinforcedDiagonal
      edges:
        - to: reinforcedGirder
          completed:
            - !type:SpawnPrototype
              prototype: SheetPlasteel1
              amount: 2
          steps:
            - tool: Cutting
              doAfter: 1
            - tool: Screwing
              doAfter: 1
            - tool: Welding
              doAfter: 5
            - tool: Prying
              doAfter: 1
            - tool: Anchoring
              doAfter: 1
            - tool: Welding
              doAfter: 10
            - tool: Prying
              doAfter: 1
            - tool: Screwing
              doAfter: 1
            - tool: Cutting
              doAfter: 1

    - node: girder
      entity: Girder

    - node: reinforcedGirder
      entity: ReinforcedGirder
