- type: entity
  abstract: true
  id: MobArcIndTimedDespawn
  components:
  - type: TimedDespawn
    lifetime: 3000 # 50 mins (max blue space event duration involving these mobs - 40 mins)

- type: entity
  name: Shredder
  id: MobArcIndShredder
  parent:
#  - SimpleSpaceMobBase # Radiant sector
  #- MobArcIndTimedDespawn
  - MobRogueSiliconDestructibleBehavior # Radiant sector
  - MobMovementSpeedModifierMelee # Radiant sector
  - MobRogueSiliconBase # Radiant sector
  - MobPassiveRegen # Radiant sector
  - MobRogueSiliconAISimpleMelee # Radiant sector
  description: A small drone meant to deconstruct both organic and non-organic structures
  components:
    - type: InputMover
    - type: MobMover
    - type: HTN
      rootTask:
        task: SimpleHostileCompound
    - type: NpcFactionMember
      factions:
        - SimpleHostile
    - type: Sprite
      drawdepth: Mobs
      sprite: _NF/Mobs/ArcadiaIndustries/arcind_shredder.rsi
      layers:
        - map: ["enum.DamageStateVisualLayers.Base"]
          state: alive
          scale: 0.8, 0.8
    - type: Physics
    - type: MovementSpeedModifier
      baseWalkSpeed : 4
      baseSprintSpeed : 6
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.20
          density: 20
          mask:
            - SmallMobMask
          layer:
            - SmallMobLayer
    - type: MobState
      allowedStates:
        - Alive
        - Dead
    - type: MobThresholds
      thresholds:
        0: Alive
        25: Critical # Radiant_sector
        30: Dead # Radiant_sector
    - type: SolutionContainerManager # Radiant sector start
      solutions:
        melee:
          reagents:
          - ReagentId: Licoxide
            Quantity: 6
    - type: AmbientSound
      sound:
        path: /Audio/_NF/Effects/silence.ogg
    - type: FootstepModifier
      footstepSoundCollection:
        path: /Audio/_NF/Effects/silence.ogg
    - type: SpamEmitSound
      minInterval: 10
      maxInterval: 60
      sound:
        path: /Audio/_NF/Effects/silence.ogg
    - type: MeleeChemicalInjector
      solution: melee
      transferAmount: 1 # Radiant sector end
    - type: Stamina
      critThreshold: 25
      animationThreshold: 10
    - type: MovementAlwaysTouching
    - type: DamageStateVisuals
      states:
        Alive:
          Base: alive
        Dead:
          Base: dead
    - type: CombatMode
    - type: MeleeWeapon
      soundHit:
        path: /Audio/Effects/bite.ogg
      angle: 0
      animation: WeaponArcBite
      damage:
        groups:
          Brute: 4
    - type: Damageable
      damageContainer: Inorganic
    - type: Bloodstream
      bloodReagent: Oil
      bloodlossDamage:
        types:
          Bloodloss:
            1

- type: entity
  name: Hijacked Hologuardian
  id: MobArcIndHoloparasiteGuardian
  parent:
#  - SimpleSpaceMobBase # Radiant sector
  #- MobArcIndTimedDespawn
  - MobRogueSiliconDestructibleBehavior # Radiant sector
  - MobMovementSpeedModifierMelee # Radiant sector
  - MobRogueSiliconBase # Radiant sector
  - MobPassiveRegen # Radiant sector
  - MobRogueSiliconAISimpleMelee # Radiant sector
  description: A syndicate hologuardian that seems to have been modified by unknown means.
  components:
    - type: Sprite
      drawdepth: Mobs
      sprite: _NF/Mobs/ArcadiaIndustries/arcind_guardians.rsi
      layers:
        - map: [ "enum.DamageStateVisualLayers.Base" ]
          state: alive
    - type: NpcFactionMember
      factions:
        - SimpleHostile
    - type: MobState
      allowedStates:
        - Alive
        - Dead
    - type: DamageStateVisuals
      states:
        Alive:
          Base: alive
        Dead:
          Base: dead
    - type: MobThresholds
      thresholds:
        0: Alive
        120: Critical # Radiant_sector
        150: Dead # Radiant_sector
    - type: Stamina
      critThreshold: 100
    - type: SlowOnDamage
      speedModifierThresholds:
        50: 0.8
        90: 0.65
    - type: HTN
      rootTask:
        task: SimpleHumanoidHostileCompound
    - type: AmbientSound # Radiant sector
      sound: # Radiant sector
        path: /Audio/_NF/Effects/silence.ogg # Radiant sector
    - type: FootstepModifier # Radiant sector
      footstepSoundCollection: # Radiant sector
        path: /Audio/_NF/Effects/silence.ogg # Radiant sector
    - type: SpamEmitSound # Radiant sector
      minInterval: 10 # Radiant sector
      maxInterval: 60 # Radiant sector
      sound: # Radiant sector
        path: /Audio/_NF/Effects/silence.ogg # Radiant sector
    - type: MeleeWeapon
      angle: 30
      animation: WeaponArcClaw
      attackRate: 1
      damage:
        types:
          Piercing: 7.5
#          Heat: 7.5 # Radiant sector
          Shock: 7.5 # Radiant sector
    - type: Damageable
      damageContainer: Inorganic
    - type: Bloodstream
      bloodReagent: Oil
      bloodlossDamage:
        types:
          Bloodloss:
            1

- type: entity
  name: Mobile Blaster Unit
  parent:
#  - SimpleSpaceMobBase # Radiant sector
  #- MobArcIndTimedDespawn
  - MobRogueSiliconDestructibleBehavior # Radiant sector
  - MobRogueSiliconDroneBase # Radiant sector
  - MobPassiveRegen # Radiant sector
  - MobRogueSiliconHitscanBatteryAmmo # Radiant sector
  id: MobArcIndBlaster
  description: A mobile energy blaster that capable of... oh god run it's spotted you!
  components:
    - type: NpcFactionMember
      factions:
        - SimpleHostile
    - type: HTN
      rootTask:
        task: SimpleRangedHostileCompound
    - type: Sprite
      drawdepth: Mobs
      sprite: _NF/Mobs/ArcadiaIndustries/arcind_blasters.rsi
      layers:
        - map: [ "enum.DamageStateVisualLayers.Base" ]
          state: alive
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.30
          density: 80
          mask:
            - MobMask
          layer:
            - MobLayer
    - type: DamageStateVisuals
      states:
        Alive:
          Base: alive
        Dead:
          Base: dead
    - type: MobThresholds
      thresholds:
        0: Alive
        60: Critical # Radiant_sector
        100: Dead # Radiant_sector
    - type: SpamEmitSound # Radiant sector
      minInterval: 10 # Radiant sector
      maxInterval: 60 # Radiant sector
      sound: # Radiant sector
        path: /Audio/_NF/Effects/silence.ogg # Radiant sector
    - type: MovementSpeedModifier
      baseWalkSpeed: 2
      baseSprintSpeed: 5
    - type: Tag
      tags:
        - FootstepSound
    - type: Reflect # Radiant sector
    - type: AmbientSound # Radiant sector
      sound: # Radiant sector
        path: /Audio/_NF/Effects/silence.ogg # Radiant sector
    - type: HitscanBatteryAmmoProvider
#      proto: NFRedLightLaser # Radiant sector
      proto: NFRedSpecialLaser
      fireCost: 50
    - type: BatterySelfRecharger
      autoRecharge: true
      autoRechargeRate: 50
    - type: Battery
      maxCharge: 1000
      startingCharge: 1000
    - type: Gun
      fireRate: 1
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
    - type: CombatMode
    - type: Damageable
      damageContainer: Inorganic
    - type: FootstepModifier
      footstepSoundCollection:
        collection: FootstepXenoborg
    - type: Bloodstream
      bloodReagent: Oil
      bloodlossDamage:
        types:
          Bloodloss:
            1
