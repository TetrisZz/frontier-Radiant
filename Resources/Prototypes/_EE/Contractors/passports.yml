- type: entity
  parent: BaseItem
  id: EEPassport
  name: Asgard sector passport
  description: An identity document of the Asgard sector.
  components:
  - type: Passport
    design: adhomai
    citizenship: Asgard
  - type: Sprite
    sprite: _EE/Contractors/Passport.rsi
    layers:
    - state: passport_adhomai_closed
    - state: passport_species_human
      visible: false
  - type: Icon
    sprite: _EE/Contractors/Passport.rsi
    state: passport_adhomai_closed
  - type: UserInterface
    interfaces:
      enum.PassportUiKey.Key:
        type: PassportBoundUserInterface

