- type: entity
  id: DiseaseDiagnoser
  parent: [ BaseMachinePowered, SmallConstructibleMachine ]
  name: Disease Diagnoser Delta Extreme
  description: A machine that analyzes disease samples.
  placement:
    mode: SnapgridCenter
  components:
  - type: VirologyMachine
  - type: ActivatableUI
    key: enum.VirologyUiKey.Key
  - type: UserInterface
    interfaces:
      enum.VirologyUiKey.Key:
        type: VirologyBoundUserInterface
  - type: EmptyOnMachineDeconstruct
    containers: [virology-sample]
  - type: GuideHelp
    guides: [RadiantVirology]
  - type: Sprite
    sprite: Structures/Machines/diagnoser.rsi
    layers:
    - state: icon
      map: ["enum.DiseaseMachineVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.DiseaseMachineVisualLayers.IsOn"]
  - type: Appearance
  - type: AmbientSound
    enabled: false
    range: 3
    volume: -18
    sound:
      path: /Audio/Machines/scan_loop.ogg
  - type: GenericVisualizer
    visuals:
      enum.VirologyMachineVisuals.Running:
        enum.DiseaseMachineVisualLayers.IsRunning:
          True: { state: running }
          False: { state: icon }
      enum.VirologyMachineVisuals.Powered:
        enum.DiseaseMachineVisualLayers.IsOn:
          True: { visible: true }
          False: { visible: false }
  - type: Machine
    board: DiagnoserMachineCircuitboard

- type: entity
  name: disease diagnoser report
  parent: Paper
  id: DiagnosisReportPaper
  description: 'A chilling medical receipt.'
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper_receipt
    - state: paper_receipt_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_perforated.svg.96dpi.png"
    headerImagePath: "/Textures/Interface/Paper/paper_heading_virus.svg.96dpi.png"
    headerMargin: 0.0, 0.0, 0.0, 6.0
    backgroundImageTile: true
    backgroundPatchMargin: 0.0, 6.0, 0.0, 6.0
    contentMargin: 12.0, 0.0, 12.0, 0.0
    # The report includes multi-line findings; a receipt-width content area clips them.
    maxWritableArea: 400.0, 0.0
