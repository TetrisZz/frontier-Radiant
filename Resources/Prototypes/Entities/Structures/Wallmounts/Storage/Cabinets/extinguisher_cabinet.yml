- type: entity
  parent: BaseWallmountCabinet
  id: ExtinguisherCabinet
  name: extinguisher cabinet
  description: A small wall mounted cabinet designed to hold a fire extinguisher.
  components:
    - type: Sprite
      sprite: _radiant/Structures/Wallmounts/extinguisher_cabinet.rsi
      snapCardinals: true
      layers:
      - state: extinguisher_empty_closed
        map: ["cabinet"]
    - type: ItemCabinet
      emptyOpenState: extinguisher_empty_open
      emptyClosedState: extinguisher_empty_closed
      defaultItemStates:
        open: extinguisher_standard_open
        closed: extinguisher_closed
      itemStateOverrides:
        FireExtinguisherMini:
          open: extinguisher_mini_open
          closed: extinguisher_mini_closed
        FireExtinguisherBluespace:
          open: extinguisher_advanced_open
          closed: extinguisher_advanced_closed
    - type: GenericVisualizer
      visuals:
        enum.ItemCabinetVisuals.State:
          cabinet:
            extinguisher_empty_closed: { state: extinguisher_empty_closed, visible: true }
            extinguisher_empty_open: { state: extinguisher_empty_open, visible: true }
            extinguisher_mini_open: { state: extinguisher_mini_open, visible: true }
            extinguisher_standard_open: { state: extinguisher_standard_open, visible: true }
            extinguisher_advanced_open: { state: extinguisher_advanced_open, visible: true }
            extinguisher_mini_closed: { state: extinguisher_mini_closed, visible: true }
            extinguisher_closed: { state: extinguisher_closed, visible: true }
            extinguisher_advanced_closed: { state: extinguisher_advanced_closed, visible: true }
    - type: ItemSlots
      slots:
        ItemCabinet:
          ejectOnInteract: true
          whitelist:
            components:
            - SpraySafety
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 80
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 40
          behaviors:
            - !type:EmptyAllContainersBehaviour
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalGlassBreak
                params:
                  volume: -4

- type: entity
  parent: ExtinguisherCabinet
  id: ExtinguisherCabinetOpen
  suffix: Open
  components:
  - type: Openable
    opened: true

- type: entity
  parent: ExtinguisherCabinet
  id: ExtinguisherCabinetFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - FireExtinguisher

- type: entity
  parent: [ExtinguisherCabinetFilled, ExtinguisherCabinetOpen]
  id: ExtinguisherCabinetFilledOpen
  suffix: Filled, Open
