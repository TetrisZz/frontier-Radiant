- type: entity
  abstract: true
  parent: [Clothing, RecyclableItemClothDevice] # Frontier: added RecyclableItemClothDevice
  id: ClothingMaskBase
  components:
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_radiant/Items/handling/generic_small_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_radiant/Items/handling/generic_small_drop.ogg
  - type: Sprite
    state: icon
  - type: Item
    size: Small
  - type: Clothing
    unequipSound:
      collection: GenericEquip
      params:
        volume: -7
    equipSound:
      collection: GenericEquip
    slots: [mask]
  - type: StaticPrice
    price: 25

- type: entity
  abstract: true
  parent: ClothingMaskBase
  id: ClothingMaskPullableBase
  components:
  - type: Mask

- type: entity
  parent: BaseAction
  id: ActionToggleMask
  name: Toggle Mask
  description: Handy, but prevents insertion of pie into your pie hole.
  components:
  - type: Action
    icon: { sprite: Clothing/Mask/gas.rsi, state: icon }
    iconOn: Interface/Default/blocked.png
  - type: InstantAction
    event: !type:ToggleMaskEvent

- type: entity
  id: ClothingMaskBaseButcherable
  parent: ClothingMaskBase
  abstract: true
  components:
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 1
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 50
  - type: Edible
    requiresSpecialDigestion: true
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Fiber
          Quantity: 10
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
